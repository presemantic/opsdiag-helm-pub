## @section Global parameters
##
## Global image parameters
##
## @param global Global container image override settings
global:
  ## @param global.imageRegistry Global container image registry override
  imageRegistry: ""
  ## @param global.imagePullSecrets Global container registry secret names as an array
  imagePullSecrets: []
  ## @param global.externalURL Optional canonical external App origin used as the OAuth issuer; when empty it is derived from the enabled OpenShift Route, Ingress, or Istio exposure
  externalURL: ""
  ## OpenShift compatibility settings
  ##
  compatibility:
    openshift:
      ## @param global.compatibility.openshift.adaptSecurityContext Adapt fixed user and group IDs to the OpenShift restricted SCC; `auto` detects OpenShift from cluster capabilities
      adaptSecurityContext: auto

## Common chart parameters
##
## @param namespaceOverride String to fully override the release namespace
namespaceOverride: ""
## @param commonLabels Labels to add to every deployed resource
commonLabels: {}
## @param commonAnnotations Annotations to add to every deployed resource
commonAnnotations: {}

## @section Embedded PostgreSQL parameters
##
## The chart installs two independent PostgreSQL 18 instances by default. Set the
## matching `enabled` value to false and provide the corresponding URL under
## `api.config.database.url` or `api.config.tablesDatabase.url` to use an external database.
## An explicit URL always takes precedence over the embedded connection generated here.
##
## @param pgsql Main App PostgreSQL settings
pgsql:
  ## @param pgsql.enabled Deploy the main App PostgreSQL instance
  enabled: true
  ## @param pgsql.image Official PostgreSQL container image settings
  image:
    ## @param pgsql.image.registry Official PostgreSQL image registry
    registry: registry-1.docker.io
    ## @param pgsql.image.repository Official PostgreSQL image repository
    repository: library/postgres
    ## @param pgsql.image.tag PostgreSQL major-version tag; `Always` pull policy follows the newest available 18.x image
    tag: "18"
    ## @param pgsql.image.digest Optional immutable PostgreSQL image digest; when set it overrides the tag
    digest: ""
    ## @param pgsql.image.pullPolicy PostgreSQL image pull policy
    pullPolicy: Always
    ## @param pgsql.image.pullSecrets PostgreSQL image pull secrets
    pullSecrets: []
  ## @param pgsql.auth Main App database credentials; password is required when no explicit URL is supplied
  auth:
    ## @param pgsql.auth.username Main App database username
    username: app
    ## @param pgsql.auth.password Main App database password used when `existingSecret` is empty
    password: ""
    ## @param pgsql.auth.database Main App database name
    database: app
    ## @param pgsql.auth.existingSecret Existing Secret containing the database password; requires an explicit `api.config.database.url`
    existingSecret: ""
    ## @param pgsql.auth.secretKeys Password key names in the generated or existing Secret
    secretKeys:
      ## @param pgsql.auth.secretKeys.userPasswordKey Secret key containing the Main App database password
      userPasswordKey: password
  ## @param pgsql.primary Main App PostgreSQL primary workload settings
  primary:
    ## @param pgsql.primary.serviceAccount Main App PostgreSQL ServiceAccount settings
    serviceAccount:
      ## @param pgsql.primary.serviceAccount.create Create a dedicated ServiceAccount
      create: true
      ## @param pgsql.primary.serviceAccount.name ServiceAccount name; generated when empty
      name: ""
      ## @param pgsql.primary.serviceAccount.annotations Additional ServiceAccount annotations
      annotations: {}
      ## @param pgsql.primary.serviceAccount.automountServiceAccountToken Mount the Kubernetes API token
      automountServiceAccountToken: false
    ## @param pgsql.primary.updateStrategy StatefulSet update strategy
    updateStrategy:
      ## @param pgsql.primary.updateStrategy.type StatefulSet update strategy type
      type: RollingUpdate
    ## @param pgsql.primary.podManagementPolicy StatefulSet pod management policy
    podManagementPolicy: OrderedReady
    ## @param pgsql.primary.podSecurityContext PostgreSQL pod security context
    podSecurityContext:
      ## @param pgsql.primary.podSecurityContext.enabled Enable the PostgreSQL pod security context
      enabled: true
      ## @param pgsql.primary.podSecurityContext.fsGroup Filesystem group used by PostgreSQL
      fsGroup: 999
      ## @param pgsql.primary.podSecurityContext.fsGroupChangePolicy Filesystem group ownership change policy
      fsGroupChangePolicy: OnRootMismatch
      ## @param pgsql.primary.podSecurityContext.seccompProfile PostgreSQL pod seccomp profile
      seccompProfile:
        ## @param pgsql.primary.podSecurityContext.seccompProfile.type PostgreSQL pod seccomp profile type
        type: RuntimeDefault
    ## @param pgsql.primary.containerSecurityContext PostgreSQL container security context
    containerSecurityContext:
      ## @param pgsql.primary.containerSecurityContext.enabled Enable the PostgreSQL container security context
      enabled: true
      ## @param pgsql.primary.containerSecurityContext.runAsUser PostgreSQL process user ID
      runAsUser: 999
      ## @param pgsql.primary.containerSecurityContext.runAsGroup PostgreSQL process group ID
      runAsGroup: 999
      ## @param pgsql.primary.containerSecurityContext.runAsNonRoot Require a non-root PostgreSQL process
      runAsNonRoot: true
      ## @param pgsql.primary.containerSecurityContext.allowPrivilegeEscalation Allow PostgreSQL privilege escalation
      allowPrivilegeEscalation: false
      ## @param pgsql.primary.containerSecurityContext.readOnlyRootFilesystem Use a read-only PostgreSQL root filesystem
      readOnlyRootFilesystem: true
      ## @param pgsql.primary.containerSecurityContext.capabilities PostgreSQL Linux capability settings
      capabilities:
        ## @param pgsql.primary.containerSecurityContext.capabilities.drop PostgreSQL Linux capabilities to drop
        drop:
          - ALL
    ## @param pgsql.primary.resources PostgreSQL resource requests and limits
    resources:
      ## @param pgsql.primary.resources.requests PostgreSQL resource requests
      requests:
        ## @param pgsql.primary.resources.requests.cpu Requested PostgreSQL CPU
        cpu: 100m
        ## @param pgsql.primary.resources.requests.memory Requested PostgreSQL memory
        memory: 256Mi
    ## @param pgsql.primary.persistence PostgreSQL data persistence settings
    persistence:
      ## @param pgsql.primary.persistence.enabled Persist PostgreSQL data in a PVC
      enabled: true
      ## @param pgsql.primary.persistence.existingClaim Existing PVC mounted at `/var/lib/postgresql`; no volumeClaimTemplate is created
      existingClaim: ""
      ## @param pgsql.primary.persistence.storageClass StorageClass for the generated PVC; `-` disables dynamic provisioning
      storageClass: ""
      ## @param pgsql.primary.persistence.accessModes Access modes for the generated PVC
      accessModes:
        - ReadWriteOnce
      ## @param pgsql.primary.persistence.size Requested PostgreSQL data volume size
      size: 50Gi
      ## @param pgsql.primary.persistence.annotations Additional generated PVC annotations
      annotations: {}
      ## @param pgsql.primary.persistence.selector Label selector for a pre-provisioned PersistentVolume
      selector: {}
    ## @param pgsql.primary.service Stable client Service settings
    service:
      ## @param pgsql.primary.service.type PostgreSQL Service type
      type: ClusterIP
      ## @param pgsql.primary.service.annotations Additional PostgreSQL Service annotations
      annotations: {}
      ## @param pgsql.primary.service.clusterIP Requested PostgreSQL Service cluster IP
      clusterIP: ""
      ## @param pgsql.primary.service.sessionAffinity PostgreSQL Service session affinity
      sessionAffinity: None
      ## @param pgsql.primary.service.ports PostgreSQL Service port settings
      ports:
        ## @param pgsql.primary.service.ports.pgsql PostgreSQL client port
        pgsql: 5432
    ## @param pgsql.primary.startupProbe PostgreSQL startup probe settings
    startupProbe:
      ## @param pgsql.primary.startupProbe.enabled Enable the PostgreSQL startup probe
      enabled: true
      ## @param pgsql.primary.startupProbe.spec PostgreSQL startup probe timing settings
      spec:
        ## @param pgsql.primary.startupProbe.spec.periodSeconds PostgreSQL startup probe period in seconds
        periodSeconds: 5
        ## @param pgsql.primary.startupProbe.spec.timeoutSeconds PostgreSQL startup probe timeout in seconds
        timeoutSeconds: 5
        ## @param pgsql.primary.startupProbe.spec.failureThreshold PostgreSQL startup probe failure threshold
        failureThreshold: 60
    ## @param pgsql.primary.readinessProbe PostgreSQL readiness probe settings
    readinessProbe:
      ## @param pgsql.primary.readinessProbe.enabled Enable the PostgreSQL readiness probe
      enabled: true
      ## @param pgsql.primary.readinessProbe.spec PostgreSQL readiness probe timing settings
      spec:
        ## @param pgsql.primary.readinessProbe.spec.periodSeconds PostgreSQL readiness probe period in seconds
        periodSeconds: 10
        ## @param pgsql.primary.readinessProbe.spec.timeoutSeconds PostgreSQL readiness probe timeout in seconds
        timeoutSeconds: 5
        ## @param pgsql.primary.readinessProbe.spec.failureThreshold PostgreSQL readiness probe failure threshold
        failureThreshold: 6
    ## @param pgsql.primary.livenessProbe PostgreSQL liveness probe settings
    livenessProbe:
      ## @param pgsql.primary.livenessProbe.enabled Enable the PostgreSQL liveness probe
      enabled: true
      ## @param pgsql.primary.livenessProbe.spec PostgreSQL liveness probe timing settings
      spec:
        ## @param pgsql.primary.livenessProbe.spec.periodSeconds PostgreSQL liveness probe period in seconds
        periodSeconds: 10
        ## @param pgsql.primary.livenessProbe.spec.timeoutSeconds PostgreSQL liveness probe timeout in seconds
        timeoutSeconds: 5
        ## @param pgsql.primary.livenessProbe.spec.failureThreshold PostgreSQL liveness probe failure threshold
        failureThreshold: 6
    ## @param pgsql.primary.podLabels Additional PostgreSQL pod labels
    podLabels: {}
    ## @param pgsql.primary.podAnnotations Additional PostgreSQL pod annotations
    podAnnotations: {}
    ## @param pgsql.primary.affinity PostgreSQL pod affinity rules
    affinity: {}
    ## @param pgsql.primary.nodeSelector Node labels for PostgreSQL pod assignment
    nodeSelector: {}
    ## @param pgsql.primary.tolerations Tolerations for PostgreSQL pod assignment
    tolerations: []
    ## @param pgsql.primary.topologySpreadConstraints Topology spread constraints for PostgreSQL pods
    topologySpreadConstraints: []
    ## @param pgsql.primary.priorityClassName PostgreSQL pod priority class
    priorityClassName: ""
    ## @param pgsql.primary.schedulerName Alternate Kubernetes scheduler for PostgreSQL
    schedulerName: ""
    ## @param pgsql.primary.terminationGracePeriodSeconds PostgreSQL pod termination grace period
    terminationGracePeriodSeconds: 60

