      pagerduty: []
    ## @param sched.config.sources Opsgenie and PagerDuty source arrays
    sources:
      ## @param sched.config.sources.opsgenie Opsgenie source entries
      opsgenie: []
      ## @param sched.config.sources.pagerduty PagerDuty source entries
      pagerduty: []

  ## Additional App Scheduler deployment settings
