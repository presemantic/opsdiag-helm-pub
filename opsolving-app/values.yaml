## @section App API parameters
##
## @param api App API component settings
api:
  ## @param api.replicaCount Number of App API replicas
  replicaCount: 1
  ## App API autoscaling parameters
  autoscaling:
    ## @param api.autoscaling.enabled Enable HorizontalPodAutoscaler
    enabled: false
    ## @param api.autoscaling.minReplicas Minimum number of replicas
    minReplicas: 1
    ## @param api.autoscaling.maxReplicas Maximum number of replicas
    maxReplicas: 10
    ## @param api.autoscaling.targetCPUUtilizationPercentage Target average CPU utilization
    targetCPUUtilizationPercentage: 80
    ## @param api.autoscaling.targetMemoryUtilizationPercentage Target average memory utilization; empty disables the memory metric
    targetMemoryUtilizationPercentage: ""
  ## @param api.revisionHistoryLimit Number of previous ReplicaSets retained for rollback
  revisionHistoryLimit: 10

  ## App API image
  ##
  ## @param api.image App API container image settings
  image:
    ## @param api.image.registry App API image registry
    registry: europe-docker.pkg.dev
    ## @param api.image.repository App API image repository
    repository: presemantic/public/images/opsolving-app-api
    ## @param api.image.tag App API image tag
    tag: "2026-08-29.23-16-53.a2c39e8"
    ## @param api.image.digest App API image digest; overrides the tag when set
    digest: "sha256:278c3aa555ca461bd9e4e5c50d4d2e73c9bd6d9b3e4e47c943a44e4a8208828e"
    ## @param api.image.pullPolicy App API image pull policy
    pullPolicy: IfNotPresent
    ## @param api.image.pullSecrets App API image pull secrets
    pullSecrets: []

  ## App API deployment and runtime
  ##
  ## @param api.updateStrategy App API Deployment update strategy
  updateStrategy:
    ## @param api.updateStrategy.type App API Deployment strategy type
    type: RollingUpdate

  ## @param api.config App API runtime configuration rendered to `/app/config.yaml`
  config:
    ## @param api.config.license App API license
    license: ""
    ## @param api.config.licenseServer Control Edge origin used for App API license verification
    licenseServer: https://edge.opsolving.ai
    ## @param api.config.database App API PostgreSQL connection settings
    database:
      ## @param api.config.database.url PostgreSQL connection URL
      url: ""
    ## @param api.config.tablesDatabase Dedicated PostgreSQL connection settings for tenant workspace tables
    tablesDatabase:
      ## @param api.config.tablesDatabase.url Dedicated workspace-tables PostgreSQL connection URL
      url: ""
    ## @param api.config.agent App API connection settings for App Agent
    agent:
      ## @param api.config.agent.url Internal App Agent run URL; rendered from the Helm release name
      url: 'http://{{ include "opsolving-app.componentName" (dict "root" . "component" "agent") }}:{{ .Values.agent.service.ports.http }}/api/run'
    ## @param api.config.internal App API internal callback settings
    internal:
      ## @param api.config.internal.baseUrl Internal App API base URL; rendered from the Helm release name
      baseUrl: 'http://{{ include "opsolving-app.componentName" (dict "root" . "component" "api") }}:{{ .Values.api.service.ports.http }}'
    ## @param api.config.modelProfileSecret Encryption key for tenant model-profile credentials
    modelProfileSecret: ""
    ## @param api.config.auth App API bootstrap authentication settings
    auth:
      ## @param api.config.auth.username Config-managed bootstrap username
      username: ""
      ## @param api.config.auth.password Config-managed bootstrap password
      password: ""
      ## @param api.config.auth.jwtSecret HMAC secret used for App API authentication tokens
      jwtSecret: ""
      ## @param api.config.auth.jwtExpiresSeconds Lifetime of App API authentication tokens in seconds
      jwtExpiresSeconds: 86400
    ## @param api.config.oauth App OAuth/OIDC authorization-server settings
    oauth:
      ## @param api.config.oauth.issuer Canonical OAuth/OIDC issuer origin
      issuer: '{{ include "opsolving-app.externalURL" . }}'
    ## @param api.config.scheduler App API connection settings for App Scheduler
    scheduler:
      ## @param api.config.scheduler.url Internal App Scheduler URL; rendered from the Helm release name
      url: 'http://{{ include "opsolving-app.componentName" (dict "root" . "component" "sched") }}:{{ .Values.sched.service.ports.http }}'
    ## @param api.config.vcs App API connection settings for App VCS
    vcs:
      ## @param api.config.vcs.url Internal App VCS URL; rendered from the Helm release name
      url: 'http://{{ include "opsolving-app.componentName" (dict "root" . "component" "vcs") }}:{{ .Values.vcs.service.ports.http }}'

  ## Additional App API deployment settings
  ##
  ## @param api.extraEnvVars Additional environment variables for the App API container
  extraEnvVars:
    - name: GOMAXPROCS
      value: "2"
    - name: GOMEMLIMIT
      value: 512MiB
  ## @param api.extraEnvVarsCM Existing ConfigMap containing additional App API environment variables
  extraEnvVarsCM: ""
  ## @param api.extraEnvVarsSecret Existing Secret containing additional App API environment variables
  extraEnvVarsSecret: ""
  ## App API ServiceAccount
  ##
  ## @param api.serviceAccount App API ServiceAccount settings
  serviceAccount:
    ## @param api.serviceAccount.create Create a ServiceAccount for App API
    create: true
    ## @param api.serviceAccount.name App API ServiceAccount name; generated when empty
    name: ""
    ## @param api.serviceAccount.annotations Additional App API ServiceAccount annotations
    annotations: {}
    ## @param api.serviceAccount.automountServiceAccountToken Mount the ServiceAccount token in App API pods
    automountServiceAccountToken: false

  ## App API security contexts
  ##
  ## @param api.podSecurityContext App API pod security context settings
  podSecurityContext:
    ## @param api.podSecurityContext.enabled Enable App API pod security context
    enabled: true
    ## @param api.podSecurityContext.seccompProfile App API pod seccomp profile
    seccompProfile:
      ## @param api.podSecurityContext.seccompProfile.type App API pod seccomp profile type
      type: RuntimeDefault

  ## @param api.containerSecurityContext App API container security context settings
  containerSecurityContext:
    ## @param api.containerSecurityContext.enabled Enable App API container security context
    enabled: true
    ## @param api.containerSecurityContext.runAsNonRoot Require a non-root App API process
    runAsNonRoot: true
    ## @param api.containerSecurityContext.readOnlyRootFilesystem Use a read-only App API root filesystem
    readOnlyRootFilesystem: true
    ## @param api.containerSecurityContext.allowPrivilegeEscalation Allow App API privilege escalation
    allowPrivilegeEscalation: false
    ## @param api.containerSecurityContext.capabilities App API container Linux capability settings
    capabilities:
      ## @param api.containerSecurityContext.capabilities.drop App API Linux capabilities to drop
      drop: [ALL]

  ## App API networking
  ##
  ## @param api.containerPorts App API container port settings
  containerPorts:
    ## @param api.containerPorts.http App API container HTTP port
    http: 8000

  ## @param api.service App API Service settings
  service:
    ## @param api.service.type App API Service type
    type: ClusterIP
    ## @param api.service.annotations Additional App API Service annotations
    annotations: {}
    ## @param api.service.ports App API Service port settings
    ports:
      ## @param api.service.ports.http App API Service HTTP port
      http: 8000
    ## @param api.service.clusterIP App API Service cluster IP
    clusterIP: ""

  ## App API resources
