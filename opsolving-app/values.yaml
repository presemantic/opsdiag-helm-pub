    tag: "2026-08-12.01-39-48.c2f0b02"
    ## @param sched.image.digest App Scheduler image digest; overrides the tag when set
    digest: "sha256:3e645c0340619385843ac873973d818330d1a772ccc2d9dbc6e668fe0ae40964"
